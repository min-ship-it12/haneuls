<script>/* 세 하늘 — 13편 시안 scene */
(function(){
const D=[720,1280], TREE={x:122,y:524,w:475,h:746};
const EDEF=[176,298,422,544];
const NAMES=['새벽','낮','노을','밤'];
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;
uniform sampler2D tS0,tS1,tS2,tS3,tTree,tTA,tCl,tFx;
uniform float uDpr,uS,uCh,uT,uSway,uPix,uSeam;
uniform vec2 uO; uniform vec4 uE,uW0,uW1,uW2,uDrift,uSea;
const vec2 D=vec2(720.,1280.);
vec2 SU(vec2 p){float x=720.-abs(mod(p.x,1440.)-720.);return vec2(x,p.y*.8+250.)/D;}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*noise(p);p*=2.03;a*=.5;}return v;}
vec4 wAt(float x,float bw){float a=smoothstep(uE.y-bw,uE.y+bw,x),b=smoothstep(uE.z-bw,uE.z+bw,x);return mix(mix(uW0,uW1,a),uW2,b);}
vec3 sky(vec2 p,vec4 w){vec3 c=vec3(0.);
 if(w.x>.001)c+=w.x*texture2D(tS0,SU(p+vec2(uDrift.x,0.))).rgb;
 if(w.y>.001)c+=w.y*texture2D(tS1,SU(p+vec2(uDrift.y,0.))).rgb;
 if(w.z>.001)c+=w.z*texture2D(tS2,SU(p+vec2(uDrift.z,0.))).rgb;
 if(w.w>.001){vec3 n=texture2D(tS3,SU(p+vec2(uDrift.w,0.))).rgb;float l=dot(n,vec3(.3,.59,.11));
  float st=smoothstep(.42,.75,l)*smoothstep(900.,500.,p.y);float tw=sin(uT*2.2+hash(floor(p/2.))*60.);n+=n*st*tw*.55;c+=w.w*n;}
 return c;}
float b2(vec2 v){return fract(dot(v,vec2(.5,v.y*.75)));}
float b4(vec2 v){return b2(mod(floor(v/2.),2.))*.25+b2(mod(v,2.));}
vec3 ramp(vec3 a,vec3 b,vec3 c,float t){return t<.5?mix(a,b,t*2.):mix(b,c,t*2.-1.);}
void main(){
 vec2 pc=vec2(gl_FragCoord.x/uDpr,uCh-gl_FragCoord.y/uDpr);
 vec2 p=(pc-uO)/uS;
 if(uPix>0.)p=(floor(p/uPix)+.5)*uPix;
 float x=p.x;
 vec3 paper=vec3(.929,.906,.862)+(fbm(p*.06)-.5)*.03+(uPix>0.?0.:(hash(floor(p))-.5)*.018);
 paper*=1.-.10*smoothstep(380.,900.,length((p-vec2(360.,620.))*vec2(1.,.62)));
 float inS=step(uE.x,x)*step(x,uE.w);
 float dOut=max(uE.x-x,x-uE.w);
 vec4 w=wAt(clamp(x,uE.x+.5,uE.w-.5),.8);
 vec3 sk=sky(p,w);
 float cl=dot(texture2D(tCl,SU(p)),w);
 float n=fbm(p*.022+vec2(uT*.02,-uT*.015));
 float spill=smoothstep(0.,.10,cl*1.2+(n-.5)*.55-dOut/75.-.14)*step(0.,dOut);
 float sm=max(inS,spill);
 vec3 avg=sky(vec2(clamp(x,uE.x+2.,uE.w-2.),p.y*.6+250.),w);
 vec3 col=mix(paper,paper*.72+avg*.36,exp(-max(dOut,0.)/60.)*.55*(1.-inS));
 col=mix(col,sk,sm);
 vec4 fx=texture2D(tFx,vec2(p.x/720.,clamp(p.y/1280.,0.,1.)*.498));
 col=col*(1.-fx.a*sm)+fx.rgb*sm;
 vec4 ds=abs(vec4(x)-uE);
 float g=0.;
 for(int i=0;i<4;i++){float d=i==0?ds.x:i==1?ds.y:i==2?ds.z:ds.w;
  float fl=.75+.9*pow(noise(vec2(float(i)*9.,p.y*.035-uT*.6)),3.);
  g+=(exp(-d/1.0)*.9+exp(-d/7.)*.28+exp(-d/30.)*.07)*fl;}
 col+=vec3(1.,.87,.62)*g*uSeam;
 vec2 tp=p;float h=clamp((940.-p.y)/400.,0.,1.);h=h*h*(3.-2.*h);
 tp.x-=uSway*h*h+.9*sin(uT*.8+p.y*.011)*h;
 vec2 tuv=(tp-vec2(${TREE.x}.,${TREE.y}.))/vec2(${TREE.w}.,${TREE.h}.);
 if(tuv.x>0.&&tuv.x<1.&&tuv.y>0.&&tuv.y<1.){
  float a=texture2D(tTA,tuv).r;
  if(a>.003){
   vec3 tc=texture2D(tTree,tuv).rgb;
   float L=dot(tc,vec3(.3,.59,.11));
   float gr=clamp((tc.g-max(tc.r,tc.b))*7.,0.,1.);
   float crown=gr*smoothstep(1090.,1020.,p.y);
   vec3 aut=ramp(vec3(.36,.07,.05),vec3(.93,.38,.1),vec3(1.,.83,.36),clamp(L*1.35,0.,1.));
   vec3 spr=ramp(vec3(.52,.27,.4),vec3(.96,.62,.74),vec3(1.,.93,.95),clamp(L*1.3,0.,1.));
   vec3 win=ramp(vec3(.18,.27,.36),vec3(.7,.79,.88),vec3(1.,1.,1.),clamp(L*1.45,0.,1.));
   vec3 sea=tc*uSea.x+aut*uSea.y+spr*uSea.z+win*uSea.w;
   float mk=mix(crown,gr,uSea.w);
   tc=mix(tc,sea,mk);
   vec4 lw=wAt(x,46.);
   float fo=smoothstep(0.,120.,dOut)*.7;
   vec3 LC=lw.x*vec3(1.03,.9,.98)+lw.y*vec3(1.05,1.04,1.)+lw.z*vec3(1.12,.8,.64)+lw.w*vec3(.40,.50,.84);
   LC=mix(LC,vec3(1.),fo);
   float a2=texture2D(tTA,tuv+vec2(0.,-7./${TREE.h}.)).r;
   float a3=texture2D(tTA,tuv+vec2(x<360.?-6./${TREE.w}.:6./${TREE.w}.,0.)).r;
   float rim=clamp(a-a2,0.,1.)*.8+clamp(a-a3,0.,1.)*.5;
   vec3 RC=lw.x*vec3(1.,.72,.86)+lw.y*vec3(1.,.97,.8)*.5+lw.z*vec3(1.,.6,.25)*1.2+lw.w*vec3(.62,.78,1.)*.9;
   tc=tc*LC;
   tc=mix(tc,vec3(dot(tc,vec3(.3,.59,.11)))*vec3(.7,.82,1.15),lw.w*.3*(1.-fo));
   tc+=RC*rim*(1.-fo)*.85;
   col=mix(col,tc,a);
  }
 }
 vec4 ov=texture2D(tFx,vec2(p.x/720.,.502+clamp(p.y/1280.,0.,1.)*.498));
 if(ov.a>.01){vec3 oc=ov.rgb/ov.a;vec4 lw=wAt(x,46.);float fo=smoothstep(0.,120.,dOut)*.7;
  vec3 LC=lw.x*vec3(1.03,.9,.98)+lw.y*vec3(1.05,1.04,1.)+lw.z*vec3(1.12,.8,.64)+lw.w*vec3(.40,.50,.84);LC=mix(LC,vec3(1.),fo);
  oc*=LC;oc=mix(oc,vec3(dot(oc,vec3(.3,.59,.11)))*vec3(.7,.82,1.15),lw.w*.3*(1.-fo));col=mix(col,oc,min(1.,ov.a));}
 if(uPix>0.){vec2 gg=floor(p/uPix);col=floor(clamp(col,0.,1.)*14.+.2+b4(gg)*.6)/14.;}
 gl_FragColor=vec4(col,1.);
}`;

function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src;});}

window.mountSky=async function(host,A,opt){
 opt=opt||{};

 const cv=document.createElement('canvas'),fr=document.createElement('canvas');
 cv.className='sk-gl';fr.className='sk-fr';host.prepend(cv,fr);
 const gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false});
 if(!gl){host.textContent='WebGL을 지원하지 않는 브라우저입니다.';return;}
 const fx=document.createElement('canvas');fx.width=360;fx.height=1280;const fc=fx.getContext('2d');
 const fctx=fr.getContext('2d');
 function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o;}
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
 const U={};['tS0','tS1','tS2','tS3','tTree','tTA','tCl','tFx','uDpr','uS','uCh','uT','uSway','uPix','uSeam','uO','uE','uW0','uW1','uW2','uDrift','uSea'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
 const imgs=await Promise.all([A.dawn,A.day,A.sunset,A.night,A.tree,A.treeA,A.clouds].map(loadImg));
 function tex(unit,src,pm){const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);

 const $=id=>document.getElementById(id),toast=$('toast');let tt;
 const say=m=>{toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),1900);};
 const panel=document.querySelector('.panel'),glass=$('glass');
 const fitPB=()=>{const side=matchMedia('(min-width:900px) and (min-aspect-ratio:1/1)').matches;document.documentElement.style.setProperty('--pb',side?'0px':(panel.getBoundingClientRect().height-40)+'px');};
 new ResizeObserver(fitPB).observe(panel);addEventListener('resize',fitPB);fitPB();
 const api=await mountSky($('stage'),A,{pix:3,onSay:say,onExpand:(k,n)=>say(k<0?'세 하늘로 돌아왔어요':n+' 하늘로 펼쳤어요')});
 const tick=()=>{const d=new Date();$('clock').textContent=(api.flow()?'하루가 흐르는 중 · ':'지금 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' · ')+api.now();};
 tick();setInterval(tick,1000);
 setTimeout(()=>{say('빛나는 경계를 끌어 보세요');setTimeout(()=>say('띠를 두 번 톡 하면 그 하늘이 펼쳐져요'),2400);},1200);
 const seg=(id,fn)=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(+b.dataset.v);});
 const R=['맑음','이슬비','비','소나기'],RS=['맑음','눈 조금','눈','함박눈'];
 const rl=()=>$('segRain').querySelectorAll('button').forEach((b,i)=>b.textContent=(api.season()==3?RS:R)[i]);
 seg('segRain',v=>api.setRain(v));
 seg('segSea',v=>{api.setSeason(v);rl();});
 seg('segTime',v=>{api.setFlow(v==1);say(v?'하루를 빨리 흘려 봐요':'지금 시각으로 돌아가요');tick();});
 let snd=false;$('snd').onclick=()=>{snd=!snd;api.sound(snd);$('snd').textContent=snd?'♪ 소리 끄기':'♪ 소리 켜기';$('snd').setAttribute('aria-pressed',snd);};
 $('zen').onclick=()=>{const on=!document.body.classList.contains('zen');document.body.classList.toggle('zen',on);$('zen').setAttribute('aria-pressed',on);$('zen').textContent=on?'조작 보이기':'조작 숨기기';};
})();
</script>
